<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Grade 9 Python study material with lessons linked to the quiz and coding practice.">
<link rel="stylesheet" href="/shared/styles.css">
<style>
.study-hero,.next-step{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:28px;box-shadow:6px 6px 0 var(--line);}.study-hero h1,.next-step h2{font-family:"Baloo 2",sans-serif;margin:4px 0 8px;}.study-hero p{font-weight:600;color:#4B556D;max-width:720px;line-height:1.6;}.eyebrow{font-size:.75rem!important;letter-spacing:.12em;color:var(--chalk-blue)!important;font-weight:800!important;}.study-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}.study-actions a{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:10px 16px;background:#EAF4FF;font-family:"Baloo 2",sans-serif;font-weight:800;}.study-actions a:last-child{background:#FFF2C7;}.sync-note{margin:22px 0;padding:14px 16px;border-radius:12px;background:#EEFDF5;border:2px solid #8CD6AD;display:flex;gap:10px;flex-wrap:wrap;color:#24543A;}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;}.lesson-card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;}.lesson-card h2{font-family:"Baloo 2",sans-serif;font-size:1.08rem;margin:0 0 8px;}.lesson-card p{line-height:1.55;color:#414A61;}.lesson-card code{font-family:"Courier New",monospace;}.lesson-card pre{background:#1E1E2E;color:#E6EDF3;border-radius:10px;padding:14px;overflow:auto;line-height:1.55;font-size:.83rem;}.connection{background:#FFF7E0;border-left:4px solid #E7B94F;padding:10px 12px;border-radius:6px;font-size:.86rem;}.next-step{margin:24px 0 8px;text-align:center;}.next-step p{color:#4B556D;line-height:1.5;}@media(max-width:560px){.study-hero,.next-step{padding:20px;}}
.logic-toolkit{margin:22px 0;background:#F3F0FF;border:2px solid #B9A7F5;border-radius:14px;padding:20px;}.logic-toolkit h2{font-family:"Baloo 2",sans-serif;margin:0 0 6px;color:#4C3B89;}.logic-toolkit p{color:#4B556D;line-height:1.55;margin:0 0 12px;}.logic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;}.logic-grid span{background:white;border-radius:8px;padding:9px 11px;color:#3F356E;font-size:.88rem;font-weight:700;}
</style>
</head>

</html>
