<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Memory Sequence — Brainy Break</title><meta name="description" content="Play Memory Sequence on Brainy Break and test your working memory."><link rel="canonical" href="https://thebrainybreak.com/games/memory-sequence.html"><link rel="stylesheet" href="/shared/styles.css"></head>
<body class="activity-page"><header class="site-header"><a href="/" class="brand"><span class="brand-icon">🧠</span><span><span class="logo">Brainy Break</span><span class="tagline">Fun Brain Games & Learning Activities</span></span></a><nav class="main-nav"><a href="/">Home</a><a href="/games/memory-sequence.html" class="active">Brain Games</a><a href="/practice/">Learning Activities</a></nav></header>
<main class="activity-main"><div class="game-wrap activity-game-wrap"><a href="/#games" class="back-link">← All Brain Games</a><div class="game-box activity-game-box"><h1>🧠 Memory Sequence</h1><p class="game-intro">Watch the sequence, remember it, then repeat it.</p><div class="game-controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="challenge">Challenge</option></select></label><label class="timer-toggle"><input type="checkbox" id="timed-mode"> Timed mode</label><label class="timer-choice" id="timer-choice-wrap" style="display:none">Time <select id="timer-duration"><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option><option value="240">4 min</option><option value="300">5 min</option></select></label><span class="timer">⏱ <strong id="timer">No limit</strong></span><button class="restart-btn" id="restart">Restart</button></div><div class="stats"><span class="score">Score: <span id="score">0</span></span><span class="streak">Streak: <span id="streak">0</span></span></div><div id="sequence-display" class="sequence-display">Get ready…</div><div id="sequence-buttons" class="sequence-buttons"></div><div id="message" class="feedback"></div></div></div></main>
<script>
const symbols=['🔵','🟢','🟡','🔴'];let seq=[],user=[],score=0,streak=0,active=false,locked=true,timerId=null,time=60;
const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-.5)}
function start(){clearInterval(timerId);score=0;streak=0;active=true;locked=true;user=[];time=+$('timer-duration').value;$('score').textContent=0;$('streak').textContent=0;$('message').textContent='Watch carefully…';$('timer').textContent=$('timed-mode').checked?format(time):'No limit';if($('timed-mode').checked)timerId=setInterval(()=>{time--; $('timer').textContent=format(time);if(time<=0)end()},1000);showSequence();}
function format(s){return s>=60&&s%60===0?(s/60)+' min':s+'s'}
function showSequence(){const len={easy:3,standard:4,challenge:5}[$('difficulty').value];seq=Array.from({length:len},()=>symbols[Math.floor(Math.random()*symbols.length)]);$('sequence-buttons').innerHTML='';$('sequence-display').textContent='';seq.forEach((v,i)=>setTimeout(()=>{$('sequence-display').textContent=v;if(i===seq.length-1)setTimeout(()=>{$('sequence-display').textContent='Your turn!';buildButtons();locked=false},650)},i*800));}
function buildButtons(){$('sequence-buttons').innerHTML='';symbols.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>pick(v);$('sequence-buttons').appendChild(b)})}
function pick(v){if(!active||locked)return;user.push(v);$('sequence-display').textContent=user.map((x)=>'●').join(' ');if(user[user.length-1]!==seq[user.length-1]){streak=0;$('streak').textContent=0;$('message').textContent='❌ Not quite. Try the next sequence.';setTimeout(showSequence,900);user=[];locked=true;return}if(user.length===seq.length){score+=10*seq.length;streak++;$('score').textContent=score;$('streak').textContent=streak;$('message').textContent='✅ Perfect memory!';locked=true;setTimeout(showSequence,900)}}
function end(){active=false;locked=true;clearInterval(timerId);$('message').textContent='⏰ Time is up! Score: '+score+' — press Restart to play again.'}
$('restart').onclick=start;$('difficulty').onchange=start;$('timed-mode').onchange=function(){$('timer-choice-wrap').style.display=this.checked?'flex':'none';start()};$('timer-duration').onchange=start;start();
</script></body></html>
