<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Odd One Out — Brainy Break</title><meta name="description" content="Find the odd one out and test your observation and reasoning skills."><link rel="canonical" href="https://thebrainybreak.com/games/odd-one-out.html"><link rel="stylesheet" href="/shared/styles.css"></head>
<body class="activity-page"><header class="site-header"><a href="/" class="brand"><span class="brand-icon">🧠</span><span><span class="logo">Brainy Break</span><span class="tagline">Fun Brain Games & Learning Activities</span></span></a><nav class="main-nav"><a href="/">Home</a><a href="/games/odd-one-out.html" class="active">Brain Games</a><a href="/practice/">Learning Activities</a></nav></header>
<main class="activity-main"><div class="game-wrap activity-game-wrap"><a href="/#games" class="back-link">← All Brain Games</a><div class="game-box activity-game-box"><h1>🟣 Odd One Out</h1><p class="game-intro">Find the item that does not belong.</p><div class="game-controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="challenge">Challenge</option></select></label><label class="timer-toggle"><input type="checkbox" id="timed-mode"> Timed mode</label><label class="timer-choice" id="timer-choice-wrap" style="display:none">Time <select id="timer-duration"><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option><option value="240">4 min</option><option value="300">5 min</option></select></label><span class="timer">⏱ <strong id="timer">No limit</strong></span><button class="restart-btn" id="restart">Restart</button></div><div class="stats"><span class="score">Score: <span id="score">0</span></span><span class="streak">Streak: <span id="streak">0</span></span></div><div id="items" class="odd-items"></div><div id="message" class="feedback"></div></div></div></main>
<script>
const bank={easy:[['🍎','🍌','🍊','🥕'],['🐶','🐱','🐰','🚗'],['🔵','🔴','🟢','⭐']],standard:[['🍎','🍌','🍇','🥕','🍊'],['🐶','🐱','🐰','🦁','🚲'],['2','4','6','8','9']],challenge:[['Mercury','Venus','Earth','Moon','Mars'],['2','3','5','7','9'],['Triangle','Square','Circle','Rectangle','Hexagon']]};
const odd={easy:[3,3,3],standard:[3,4,4],challenge:[3,4,4]};let score=0,streak=0,active=false,time=60,timerId=null;
const $=id=>document.getElementById(id);function fmt(s){return s>=60&&s%60===0?(s/60)+' min':s+'s'}function shuffle(a){return a.sort(()=>Math.random()-.5)}
function start(){clearInterval(timerId);score=0;streak=0;active=true;time=+$('timer-duration').value;$('score').textContent=0;$('streak').textContent=0;$('timer').textContent=$('timed-mode').checked?fmt(time):'No limit';next();if($('timed-mode').checked)timerId=setInterval(()=>{time--; $('timer').textContent=fmt(time);if(time<=0)end()},1000)}
function next(){if(!active)return;const d=$('difficulty').value;const p=bank[d][Math.floor(Math.random()*bank[d].length)];const answer=p[odd[d][bank[d].indexOf(p)]];const arr=shuffle(p.slice());$('items').innerHTML='';arr.forEach(v=>{const b=document.createElement('button');b.className='odd-item';b.textContent=v;b.onclick=()=>choose(v,answer,b);$('items').appendChild(b)});$('message').textContent=''}
function choose(v,a,b){if(!active)return;if(v===a){b.classList.add('correct');score+=10;streak++;$('message').textContent='✅ Correct!'}else{b.classList.add('wrong');streak=0;$('message').textContent='❌ Odd one out: '+a}$('score').textContent=score;$('streak').textContent=streak;document.querySelectorAll('.odd-item').forEach(x=>x.disabled=true);setTimeout(next,650)}
function end(){active=false;clearInterval(timerId);$('message').textContent='⏰ Time is up! Score: '+score+' — press Restart to play again.';document.querySelectorAll('.odd-item').forEach(x=>x.disabled=true)}
$('restart').onclick=start;$('difficulty').onchange=start;$('timed-mode').onchange=function(){$('timer-choice-wrap').style.display=this.checked?'flex':'none';start()};$('timer-duration').onchange=start;start();
</script><script src="/shared/analytics.js"></script>
</body></html>
