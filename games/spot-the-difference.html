<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Spot the Difference — Brainy Break</title><meta name="description" content="Spot the different tile in visual patterns and test your observation skills."><link rel="canonical" href="https://thebrainybreak.com/games/spot-the-difference.html"><link rel="stylesheet" href="/shared/styles.css"></head>
<body class="activity-page"><header class="site-header"><a href="/" class="brand"><span class="brand-icon">🧠</span><span><span class="logo">Brainy Break</span><span class="tagline">Fun Brain Games & Learning Activities</span></span></a><nav class="main-nav"><a href="/">Home</a><a href="/games/spot-the-difference.html" class="active">Brain Games</a><a href="/practice/">Learning Activities</a></nav></header>
<main class="activity-main"><div class="game-wrap activity-game-wrap"><a href="/#games" class="back-link">← All Brain Games</a><div class="game-box activity-game-box"><h1>👀 Spot the Difference</h1><p class="game-intro">Find the one tile that is different from all the others.</p><div class="game-controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="challenge">Challenge</option></select></label><label class="timer-toggle"><input type="checkbox" id="timed-mode"> Timed mode</label><label class="timer-choice" id="timer-choice-wrap" style="display:none">Time <select id="timer-duration"><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option><option value="240">4 min</option><option value="300">5 min</option></select></label><span class="timer">⏱ <strong id="timer">No limit</strong></span><button class="restart-btn" id="restart">Restart</button></div><div class="stats"><span class="score">Score: <span id="score">0</span></span><span class="streak">Streak: <span id="streak">0</span></span></div><div id="grid" class="difference-grid"></div><div id="message" class="feedback"></div></div></div></main>
<script>
const shapeTypes=['circle','square','diamond','triangle','pill','ring','bar','cross'];
const colors=['#3C6FE0','#2E9E6D','#E4572E','#F4B740','#8B5CF6','#EC4899','#14B8A6','#64748B'];
const variations=[];
for(let i=0;i<72;i++){
  const type=shapeTypes[i%shapeTypes.length], color=colors[Math.floor(i/9)%colors.length];
  const altColor=colors[(Math.floor(i/9)+1)%colors.length];
  const mode=Math.floor(i/24);
  let base={type,color,altColor};
  if(mode===0) base.diff=['color','size','rotation'][i%3];
  else if(mode===1) base.diff=['size','radius','rotation'][i%3];
  else base.diff=['size','rotation','border'][i%3];
  variations.push(base);
}
let score=0,streak=0,active=false,time=60,timerId=null,recentPatterns=[];
const $=id=>document.getElementById(id);function fmt(s){return s>=60&&s%60===0?(s/60)+' min':s+'s'}function start(){clearInterval(timerId);score=0;streak=0;active=true;recentPatterns=[];time=+$('timer-duration').value;$('score').textContent=0;$('streak').textContent=0;$('timer').textContent=$('timed-mode').checked?fmt(time):'No limit';next();if($('timed-mode').checked)timerId=setInterval(()=>{time--; $('timer').textContent=fmt(time);if(time<=0)end()},1000)}
function next(){
 if(!active)return;
 const difficulty=$('difficulty').value;
 const size=difficulty==='easy'?9:difficulty==='standard'?16:25;
 const range=difficulty==='easy'?[0,24]:difficulty==='standard'?[24,48]:[48,72];const pool=variations.map((v,i)=>({v,i})).filter(x=>x.i>=range[0]&&x.i<range[1]&&!recentPatterns.includes(x.i));
 const index=pool.length?pool[Math.floor(Math.random()*pool.length)].i:range[0]+Math.floor(Math.random()*(range[1]-range[0]));
 const d=variations[index];
 recentPatterns.push(index);if(recentPatterns.length>12)recentPatterns.shift();
 const odd=Math.floor(Math.random()*size);
 $('grid').innerHTML='';
 for(let i=0;i<size;i++){
   const b=document.createElement('button');b.className='difference-tile';
   const s=document.createElement('span');s.className='difference-shape';
   const isOdd=i===odd;
   s.dataset.type=d.type;
   s.style.setProperty('--shape-color',isOdd?d.altColor:d.color);
   let scale=1,rotation=0,radius=18,border=0;
   if(d.diff==='size') scale=isOdd?(difficulty==='challenge'?1.07:1.16):1;
   if(d.diff==='rotation') rotation=isOdd?(difficulty==='challenge'?6:14):0;
   if(d.diff==='radius') radius=isOdd?7:18;
   if(d.diff==='border') border=isOdd?3:0;
   if(d.diff==='color' && !isOdd) s.style.setProperty('--shape-color',d.color);
   s.style.transform=`scale(${scale}) rotate(${rotation}deg)`;
   s.style.borderRadius=radius+'%';
   if(border)s.style.border=border+'px solid rgba(38,50,74,.35)';
   b.appendChild(s);b.setAttribute('aria-label',isOdd?'Different tile':'Matching tile');b.onclick=()=>choose(isOdd,b);$('grid').appendChild(b);
 }
 $('message').textContent='';
}
function choose(correct,b){if(!active)return;if(correct){b.classList.add('correct');score+=10;streak++;$('message').textContent='✅ Great observation!'}else{b.classList.add('wrong');streak=0;$('message').textContent='❌ Try again.'} $('score').textContent=score;$('streak').textContent=streak;if(correct){document.querySelectorAll('.difference-tile').forEach(x=>x.disabled=true);setTimeout(next,600)}}
function end(){active=false;clearInterval(timerId);document.querySelectorAll('.difference-tile').forEach(b=>b.disabled=true);$('message').textContent='⏰ Time is up! Score: '+score+' — press Restart to play again.'}
$('restart').onclick=start;$('difficulty').onchange=start;$('timed-mode').onchange=function(){$('timer-choice-wrap').style.display=this.checked?'flex':'none';start()};$('timer-duration').onchange=start;start();
</script></body></html>
