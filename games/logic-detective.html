<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Logic Detective Game for Kids — Free Logic Puzzles | Brainy Break</title><meta name="description" content="Play Logic Detective, a free logic game for kids. Read clues, solve reasoning puzzles and build problem-solving skills with three difficulty levels."><link rel="canonical" href="https://www.thebrainybreak.com/games/logic-detective.html"><meta property="og:title" content="Logic Detective Game for Kids | Brainy Break"><meta property="og:description" content="Solve clues and reasoning puzzles in this free logic game for kids."><meta property="og:url" content="https://www.thebrainybreak.com/games/logic-detective.html"><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Logic Detective Game for Kids | Brainy Break"><meta name="twitter:description" content="Solve clues and reasoning puzzles in this free logic game for kids."><script type="application/ld+json">{"@context":"https://schema.org","@type":"Game","name":"Logic Detective","url":"https://www.thebrainybreak.com/games/logic-detective.html","description":"A free logic game for kids with clues, reasoning puzzles and three difficulty levels.","genre":"Logic puzzle","gamePlatform":"Web browser","isAccessibleForFree":true}</script><link rel="stylesheet" href="/shared/styles.css"></head>
<body class="activity-page"><header class="site-header"><a href="/" class="brand"><span class="brand-icon">🧠</span><span><span class="logo">Brainy Break</span><span class="tagline">Fun Brain Games & Learning Activities</span></span></a><nav class="main-nav"><a href="/">Home</a><a href="/games/logic-detective.html" class="active">Brain Games</a><a href="/practice/">Learning Activities</a></nav></header>
<main class="activity-main"><div class="game-wrap activity-game-wrap"><a href="/#games" class="back-link">← All Brain Games</a><div class="game-box activity-game-box"><h1>🕵️ Logic Detective</h1><p class="game-intro">Play this free logic game for kids. Read each clue, compare the facts and choose the answer that solves the mystery.</p><div class="game-controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="challenge">Challenge</option></select></label><label class="timer-toggle"><input type="checkbox" id="timed-mode"> Timed mode</label><label class="timer-choice" id="timer-choice-wrap" style="display:none">Time <select id="timer-duration"><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option><option value="240">4 min</option><option value="300">5 min</option></select></label><span class="timer">⏱ <strong id="timer">No limit</strong></span><button class="restart-btn" id="restart">Restart</button></div><div class="stats"><span class="score">Score: <span id="score">0</span></span><span class="streak">Streak: <span id="streak">0</span></span></div><div id="question" class="logic-question"></div><div id="answers" class="answers"></div><div id="message" class="feedback"></div></div></div></main>
<script>
(function(){
const $=id=>document.getElementById(id);
const names=['Ava','Ben','Cara','Dev','Emma','Finn','Gia','Hugo','Isha','Jay','Kira','Leo','Mia','Noah','Omar','Pia','Ravi','Sara','Tara','Zane'];
const colors=['red','blue','green','yellow','purple','orange','silver','gold','pink','teal'];
const shapes=['triangle','circle','square','star','diamond','heart','hexagon','oval'];
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const pets=['cat','dog','rabbit','parrot','turtle','fish','hamster','guinea pig'];
let score=0,streak=0,active=false,time=60,timerId=null,questionToken=0,recent=[],lastFamily='';
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sample(a,n){return shuffle(a.slice()).slice(0,n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){return s>=60&&s%60===0?(s/60)+' min':s+'s'}
function makeQuestion(level){
const families=level==='easy'?['compare','compare','boxes','arrival','number','age','shapes']:level==='standard'?['compare','boxes','arrival','number','rank','shapes','days','order']:['compare','boxes','arrival','number','rank','shapes','days','order','deduction','math'];
let family=pick(families);if(family===lastFamily&&families.length>1){const alternatives=families.filter(x=>x!==lastFamily);family=pick(alternatives)}lastFamily=family;
let q,answer,choices,signature;
if(family==='compare'){
 const p=sample(names,3),levels=shuffle([1,2,3]),ordered=p.map((name,i)=>({name,rank:levels[i]})).sort((a,b)=>a.rank-b.rank);
 const type=pick([{a:'is taller than',ask:'is shortest?'},{a:'runs faster than',ask:'is slowest?'},{a:'scored more points than',ask:'scored the least?'},{a:'finished earlier than',ask:'finished last?'},{a:'has more stickers than',ask:'has the fewest stickers?'}]);
 q=ordered[0].name+' '+type.a+' '+ordered[1].name+'. '+ordered[1].name+' '+type.a+' '+ordered[2].name+'. Who '+type.ask;
 answer=ordered[2].name;choices=shuffle([...p,...sample(names.filter(x=>!p.includes(x)),1)]);signature='compare|'+ordered.map(x=>x.name).join('|')+'|'+type.ask;
}else if(family==='boxes'){
 const items=sample(colors,4),light=items[0],a=items[1],b=items[2];
 q='Four gift boxes are '+items.join(', ')+'. The '+a+' box is heavier than the '+light+' box. The '+b+' box is heavier than the '+light+' box. The '+items[3]+' box is heavier than the '+a+' box. Which box must be the lightest?';
 answer=light+' box';choices=shuffle(items.map(x=>x+' box'));signature='boxes|'+items.join('|')+'|'+a+'|'+b;
}else if(family==='arrival'){
 const p=sample(names,4),order=shuffle(p),template=pick([0,1,2]);
 if(template===0){q=order[0]+' arrived before '+order[1]+'. '+order[1]+' arrived before '+order[2]+'. '+order[2]+' arrived before '+order[3]+'. Who arrived last?';answer=order[3]}
 else if(template===1){q=order[0]+' arrived after '+order[1]+'. '+order[2]+' arrived after '+order[0]+'. '+order[3]+' arrived after '+order[2]+'. Who arrived first?';answer=order[1]}
 else{q=order[0]+' is ahead of '+order[1]+' in the queue. '+order[2]+' is behind '+order[1]+'. '+order[3]+' is behind '+order[2]+'. Who is third in the queue?';answer=order[2]}
 choices=shuffle(p);signature='arrival|'+template+'|'+order.join('|');
}else if(family==='number'){
 const a=2+Math.floor(Math.random()*18),step=pick([2,3,4,5,6,7,8]),mode=pick(['add','subtract','double']);
 if(mode==='add'){q='Find the next number: '+[a,a+step,a+2*step,a+3*step].join(', ')+', ?';answer=String(a+4*step);choices=shuffle([answer,String(a+3*step+step+1),String(a+4*step-step),String(a+4*step+2)])}
 else if(mode==='subtract'){const startN=a+step*4;q='A number pattern goes down by '+step+' each time: '+[startN,startN-step,startN-2*step,startN-3*step].join(', ')+', ?';answer=String(startN-4*step);choices=shuffle([answer,String(startN-4*step+step),String(startN-4*step-2),String(startN-3*step)])}
 else{const n=2+Math.floor(Math.random()*9);q='A number is doubled and then '+step+' is added. The result is '+(n*2+step)+'. What was the starting number?';answer=String(n);choices=shuffle([answer,String(n+1),String(Math.max(1,n-1)),String(n+2)])}
 signature='number|'+q;
}else if(family==='age'||family==='rank'){
 const p=sample(names,4),order=shuffle(p),mode=pick(['second','first','last']);
 if(mode==='second'){q=order[0]+' finished ahead of '+order[1]+'. '+order[1]+' finished ahead of '+order[2]+'. '+order[2]+' finished ahead of '+order[3]+'. Who finished second?';answer=order[1]}
 else if(mode==='first'){q=order[1]+' finished behind '+order[0]+'. '+order[2]+' finished behind '+order[1]+'. '+order[3]+' finished behind '+order[2]+'. Who finished first?';answer=order[0]}
 else{q=order[0]+' is older than '+order[1]+'. '+order[1]+' is older than '+order[2]+'. '+order[2]+' is older than '+order[3]+'. Who is youngest?';answer=order[3]}
 choices=shuffle(p);signature='rank|'+mode+'|'+order.join('|');
}else if(family==='shapes'){
 const s=sample(shapes,4),order=shuffle(s),ask=pick([1,2]);
 q='Four shapes are in a row from left to right. '+order[0]+' is before '+order[1]+'. '+order[1]+' is before '+order[2]+'. '+order[2]+' is before '+order[3]+'. Which shape is '+(ask===1?'second':'third')+' from the left?';
 answer=order[ask];choices=shuffle(s);signature='shapes|'+order.join('|')+'|'+ask;
}else if(family==='days'){
 const ordered=sample(days,4).sort((a,b)=>days.indexOf(a)-days.indexOf(b)),ask=pick([1,2]);
 q='A library event happens on '+ordered.join(', ')+'. The mystery visit is after '+ordered[ask-1]+' but before '+ordered[ask+1]+'. Which day is the visit?';
 answer=ordered[ask];choices=shuffle(ordered);signature='days|'+ordered.join('|')+'|'+ask;
}else if(family==='order'){
 const p=sample(names,4),order=shuffle(p),template=pick([0,1]);
 if(template===0){q=order[0]+' stands before '+order[1]+'. '+order[1]+' stands before '+order[2]+'. '+order[2]+' stands before '+order[3]+'. Who stands third?';answer=order[2]}
 else{q=order[0]+' sits to the left of '+order[1]+'. '+order[2]+' sits to the right of '+order[1]+'. '+order[3]+' sits to the left of '+order[0]+'. Who sits farthest left?';answer=order[3]}
 choices=shuffle(p);signature='order|'+template+'|'+order.join('|');
}else if(family==='deduction'){
 const p=sample(names,3),petOrder=sample(pets,3),owner=shuffle([0,1,2]),petsByPerson={};owner.forEach((personIdx,i)=>petsByPerson[p[personIdx]]=petOrder[i]);
 const target=p[0],other=p[1],third=p[2];
 q='Each person has a different pet. '+other+' owns a '+petsByPerson[other]+'. '+third+' owns a '+petsByPerson[third]+'. '+target+' does not own a '+petsByPerson[other]+'. Which pet does '+target+' own?';
 answer=petsByPerson[target];choices=shuffle([petsByPerson[target],petsByPerson[other],petsByPerson[third],pick(pets.filter(x=>!petOrder.includes(x)))]);signature='deduction|'+p.join('|')+'|'+petOrder.join('|');
}else{
 const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8),c=2+Math.floor(Math.random()*8),mode=pick(['plus','minus','times']);
 if(mode==='plus'){q='A detective finds '+a+' clues in the morning and '+b+' in the afternoon. '+c+' clues turn out to be duplicates. How many useful clues remain?';answer=String(a+b-c)}
 else if(mode==='minus'){q='There are '+(a+b)+' files. The detective checks '+a+' files, then '+c+' more. How many files are unchecked?';answer=String(Math.max(0,a+b-a-c))}
 else{q='There are '+a+' folders with '+b+' clues in each folder. How many clues are there altogether?';answer=String(a*b)}
 const correct=Number(answer),opts=new Set([correct]);while(opts.size<4)opts.add(Math.max(0,correct+pick([-5,-3,-2,-1,1,2,3,5])));choices=shuffle([...opts].map(String));signature='math|'+q;
}
choices=Array.from(new Set(choices.map(String)));if(!choices.includes(String(answer)))choices[0]=String(answer);
while(choices.length<4){const extra=String(1+Math.floor(Math.random()*100));if(!choices.includes(extra))choices.push(extra)}
return {q,answer:String(answer),choices:shuffle(choices.slice(0,4)),signature};
}
function uniqueQuestion(){let p;for(let i=0;i<100;i++){p=makeQuestion($('difficulty').value);if(!recent.includes(p.signature)){recent.push(p.signature);if(recent.length>150)recent.shift();return p}}recent=[];p=makeQuestion($('difficulty').value);recent.push(p.signature);return p}
function start(){clearInterval(timerId);questionToken++;score=0;streak=0;active=true;time=+$('timer-duration').value;$('score').textContent='0';$('streak').textContent='0';$('timer').textContent=$('timed-mode').checked?fmt(time):'No limit';next();if($('timed-mode').checked)timerId=setInterval(()=>{time--;$('timer').textContent=fmt(time);if(time<=0)end()},1000)}
function next(){if(!active)return;questionToken++;const p=uniqueQuestion(),token=questionToken;$('question').textContent=p.q;$('answers').innerHTML='';p.choices.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(v,p.answer,b,token);$('answers').appendChild(b)});$('message').textContent=''}
function choose(v,a,b,token){if(!active||token!==questionToken)return;questionToken++;if(v===a){b.classList.add('correct');score+=10;streak++;$('message').textContent='✅ Correct! Great deduction.'}else{b.classList.add('wrong');streak=0;$('message').textContent='❌ Correct answer: '+a+'. Read the clues carefully and try the next one.'}$('score').textContent=score;$('streak').textContent=streak;document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);setTimeout(()=>{if(active)next()},850)}
function end(){active=false;questionToken++;clearInterval(timerId);document.querySelectorAll('#answers button').forEach(b=>b.disabled=true);$('message').textContent='⏰ Time is up! Final score: '+score+'. Press Restart to play again.'}
$('restart').onclick=start;$('difficulty').onchange=start;$('timed-mode').onchange=function(){$('timer-choice-wrap').style.display=this.checked?'flex':'none';start()};$('timer-duration').onchange=start;
start();
})();
</script><script src="/shared/analytics.js"></script>
