<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Logic Detective — Brainy Break</title><meta name="description" content="Solve logic puzzles and clues in Logic Detective on Brainy Break."><link rel="canonical" href="https://thebrainybreak.com/games/logic-detective.html"><link rel="stylesheet" href="/shared/styles.css"></head>
<body class="activity-page"><header class="site-header"><a href="/" class="brand"><span class="brand-icon">🧠</span><span><span class="logo">Brainy Break</span><span class="tagline">Fun Brain Games & Learning Activities</span></span></a><nav class="main-nav"><a href="/">Home</a><a href="/games/logic-detective.html" class="active">Brain Games</a><a href="/practice/">Learning Activities</a></nav></header>
<main class="activity-main"><div class="game-wrap activity-game-wrap"><a href="/#games" class="back-link">← All Brain Games</a><div class="game-box activity-game-box"><h1>🕵️ Logic Detective</h1><p class="game-intro">Read the clues and figure out the answer.</p><div class="game-controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="challenge">Challenge</option></select></label><label class="timer-toggle"><input type="checkbox" id="timed-mode"> Timed mode</label><label class="timer-choice" id="timer-choice-wrap" style="display:none">Time <select id="timer-duration"><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option><option value="240">4 min</option><option value="300">5 min</option></select></label><span class="timer">⏱ <strong id="timer">No limit</strong></span><button class="restart-btn" id="restart">Restart</button></div><div class="stats"><span class="score">Score: <span id="score">0</span></span><span class="streak">Streak: <span id="streak">0</span></span></div><div id="question" class="logic-question"></div><div id="answers" class="answers"></div><div id="message" class="feedback"></div></div></div></main>
<script>
const bank={easy:[['Riya is taller than Amit. Amit is taller than Neha. Who is shortest?',['Riya','Amit','Neha','Cannot tell'],'Neha'],['A red box is heavier than a blue box. The blue box is heavier than a green box. Which is lightest?',['Red','Blue','Green','Same'],'Green'],['Sam arrives before Leo. Leo arrives before Mia. Who arrives last?',['Sam','Leo','Mia','Cannot tell'],'Mia']],standard:[['Asha is older than Ben. Cara is younger than Ben. Who is youngest?',['Asha','Ben','Cara','Cannot tell'],'Cara'],['The triangle is left of the circle. The square is right of the circle. Which is in the middle?',['Triangle','Circle','Square','Cannot tell'],'Circle'],['Tom scored more than Raj but less than Kim. Who scored highest?',['Tom','Raj','Kim','Cannot tell'],'Kim']],challenge:[['Maya finished before Tara but after Nia. Who finished first?',['Maya','Tara','Nia','Cannot tell'],'Nia'],['Four books are ordered: Science is before Math, and Math is before History. Art is after History. Which is last?',['Science','Math','History','Art'],'Art'],['Leo is faster than Kai. Kai is faster than Zoya. Mia is slower than Leo but faster than Kai. Who is second fastest?',['Leo','Mia','Kai','Zoya'],'Mia']]};
let idx=0,score=0,streak=0,active=false,time=60,timerId=null;
const $=id=>document.getElementById(id);function fmt(s){return s>=60&&s%60===0?(s/60)+' min':s+'s'}function start(){clearInterval(timerId);idx=0;score=0;streak=0;active=true;time=+$('timer-duration').value;$('score').textContent=0;$('streak').textContent=0;$('timer').textContent=$('timed-mode').checked?fmt(time):'No limit';next();if($('timed-mode').checked)timerId=setInterval(()=>{time--; $('timer').textContent=fmt(time);if(time<=0)end()},1000)}
function next(){if(!active)return;const p=bank[$('difficulty').value][idx++%bank[$('difficulty').value].length];$('question').textContent=p[0];$('answers').innerHTML='';shuffle(p[1].slice()).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(v,p[2],b);$('answers').appendChild(b)});$('message').textContent=''}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function choose(v,a,b){if(!active)return;if(v===a){b.classList.add('correct');score+=10;streak++;$('message').textContent='✅ Correct!'}else{b.classList.add('wrong');streak=0;$('message').textContent='❌ Answer: '+a} $('score').textContent=score;$('streak').textContent=streak;document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);setTimeout(next,700)}
function end(){active=false;clearInterval(timerId);document.querySelectorAll('#answers button').forEach(b=>b.disabled=true);$('message').textContent='⏰ Time is up! Score: '+score+' — press Restart to play again.'}
$('restart').onclick=start;$('difficulty').onchange=start;$('timed-mode').onchange=function(){$('timer-choice-wrap').style.display=this.checked?'flex':'none';start()};$('timer-duration').onchange=start;start();
</script><script src="/shared/analytics.js"></script>
</body></html>
