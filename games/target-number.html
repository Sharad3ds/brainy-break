<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Target Number — Brainy Break</title><meta name="description" content="Solve target number puzzles and sharpen your mental math and problem-solving skills."><link rel="canonical" href="https://thebrainybreak.com/games/target-number.html"><link rel="stylesheet" href="/shared/styles.css"></head>
<body class="activity-page"><header class="site-header"><a href="/" class="brand"><span class="brand-icon">🧠</span><span><span class="logo">Brainy Break</span><span class="tagline">Fun Brain Games & Learning Activities</span></span></a><nav class="main-nav"><a href="/">Home</a><a href="/games/target-number.html" class="active">Brain Games</a><a href="/practice/">Learning Activities</a></nav></header>
<main class="activity-main"><div class="game-wrap activity-game-wrap"><a href="/#games" class="back-link">← All Brain Games</a><div class="game-box activity-game-box"><h1>🎯 Target Number</h1><p class="game-intro">Choose the expression that reaches the target.</p><div class="game-controls"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="standard" selected>Standard</option><option value="challenge">Challenge</option></select></label><label class="timer-toggle"><input type="checkbox" id="timed-mode"> Timed mode</label><label class="timer-choice" id="timer-choice-wrap" style="display:none">Time <select id="timer-duration"><option value="60">60s</option><option value="120">120s</option><option value="180">180s</option><option value="240">4 min</option><option value="300">5 min</option></select></label><span class="timer">⏱ <strong id="timer">No limit</strong></span><button class="restart-btn" id="restart">Restart</button></div><div class="stats"><span class="score">Score: <span id="score">0</span></span><span class="streak">Streak: <span id="streak">0</span></span></div><div id="target" class="target-number"></div><div id="answers" class="answers"></div><div id="message" class="feedback"></div></div></div></main>
<script>
const bank={easy:[['10',['2+3+5','4×2+3','8+1+2','6+2+3']]],standard:[['24',['6×4','8×3+1','30−5','5×5−2']]],challenge:[['42',['6×7','50−7','5×9−2','8×5+3']]]};let score=0,streak=0,active=false,time=60,timerId=null;
const $=id=>document.getElementById(id);function fmt(s){return s>=60&&s%60===0?(s/60)+' min':s+'s'}function start(){clearInterval(timerId);score=0;streak=0;active=true;time=+$('timer-duration').value;$('score').textContent=0;$('streak').textContent=0;$('timer').textContent=$('timed-mode').checked?fmt(time):'No limit';next();if($('timed-mode').checked)timerId=setInterval(()=>{time--; $('timer').textContent=fmt(time);if(time<=0)end()},1000)}
function next(){if(!active)return;const p=bank[$('difficulty').value][0];$('target').textContent='Target: '+p[0];$('answers').innerHTML='';shuffle(p[1].slice()).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>choose(v,p[0],b);$('answers').appendChild(b)});$('message').textContent=''}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function choose(v,target,b){if(!active)return;const result=Function('return '+v.replaceAll('×','*').replaceAll('−','-'))();if(result===target){b.classList.add('correct');score+=10;streak++;$('message').textContent='✅ Correct!'}else{b.classList.add('wrong');streak=0;$('message').textContent='❌ Try again!'}$('score').textContent=score;$('streak').textContent=streak;document.querySelectorAll('#answers button').forEach(x=>x.disabled=true);setTimeout(next,600)}
function end(){active=false;clearInterval(timerId);$('message').textContent='⏰ Time is up! Score: '+score+' — press Restart to play again.';document.querySelectorAll('#answers button').forEach(b=>b.disabled=true)}
$('restart').onclick=start;$('difficulty').onchange=start;$('timed-mode').onchange=function(){$('timer-choice-wrap').style.display=this.checked?'flex':'none';start()};$('timer-duration').onchange=start;start();
</script></body></html>
